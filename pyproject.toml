[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docu-pulse"
version = "0.1.0"
description = "Lightweight CLI utility for code quality and documentation analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["documentation", "code-quality", "analysis", "cli", "ast"]
authors = [
    {name = "docu-pulse Contributors", email = "contributors@docu-pulse.dev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Documentation",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.990",
    "isort>=5.0",
]

[project.urls]
Homepage = "https://github.com/eaglesightservices-coder/docu-pulse"
Documentation = "https://github.com/eaglesightservices-coder/docu-pulse#readme"
Repository = "https://github.com/eaglesightservices-coder/docu-pulse.git"
Issues = "https://github.com/eaglesightservices-coder/docu-pulse/issues"

[project.scripts]
docu-pulse = "docupulse.cli:main"

[tool.setuptools]
packages = ["docupulse"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers --cov=docupulse --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
